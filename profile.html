<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог настольных игр — Личный кабинет</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/profile.js" defer></script>
    <script src="js/cart.js" defer></script>
</head>
<body>

<header>
    <a href="index.html" class="logo"><img src="images/logo.svg" alt="Логотип сайта" width="48" height="48"><span>Каталог настольных игр</span></a>
    <nav aria-label="Основная" class="main-nav">
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="catalog.html">Каталог</a></li>
            <li><a href="cart.html">Корзина <span data-cart-count>0</span></a></li>
            <li><a href="about.html">О нас</a></li>
            <li><a href="delivery.html">Доставка</a></li>
            <li><a href="contacts.html">Контакты</a></li>
        </ul>
        <a href="profile.html" class="profile-link active" title="Личный кабинет" aria-label="Личный кабинет">&#128100;</a>
    </nav>
</header>

<main>
    <h1 class="page-title">Личный кабинет</h1>

    <!-- Блок авторизации -->
    <section id="auth-section" class="auth-section" hidden>
        <div class="auth-card">

            <!-- Форма Входа -->
            <div id="login-form-container">
                <h2 class="auth-title">Вход</h2>
                <input type="text" id="login-username" name="login-username"
                       placeholder="Логин" autocomplete="username" class="auth-input">
                <input type="password" id="login-password" name="login-password"
                       placeholder="Пароль" autocomplete="current-password" class="auth-input">
                <button type="button" class="btn auth-submit" id="login-btn">Войти</button>

                <p class="auth-switch">
                    Нет аккаунта? <a href="#" id="show-register">Зарегистрироваться</a>
                </p>
            </div>

            <!-- Форма Регистрации (скрыта) -->
            <div id="register-form-container" hidden>
                <h2 class="auth-title">Регистрация</h2>
                <input type="text" id="reg-username" name="reg-username"
                       placeholder="Придумайте логин (от 3 символов)" autocomplete="username" class="auth-input">
                <input type="password" id="reg-password" name="reg-password"
                       placeholder="Придумайте пароль (от 6 символов)" autocomplete="new-password" class="auth-input">
                <button type="button" class="btn auth-submit auth-submit--register" id="register-btn">Зарегистрироваться</button>

                <p class="auth-switch">
                    Уже есть аккаунт? <a href="#" id="show-login">Войти</a>
                </p>
            </div>

            <p id="auth-error" class="auth-error" hidden></p>
        </div>
    </section>

    <!-- Блок профиля -->
    <section id="profile-section" class="profile-section" hidden>
        <h2 class="profile-title">Вы вошли как: <span id="profile-username"></span></h2>

        <h3 class="profile-subtitle">История заказов:</h3>
        <ul id="my-orders-list" class="orders-list"></ul>

        <button type="button" class="btn logout-btn" id="logout-btn">Выйти из аккаунта</button>
    </section>
</main>

<footer>
    <p>© 2026 Каталог настольных игр | <a href="contacts.html">Связаться с нами</a></p>
</footer>

</body>
</html>
